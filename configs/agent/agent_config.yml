vae_model_class: StateFSQVae

value_iteration_kwargs:
  gamma: 0.9
  n_iter: 1000
  softmax_gain: 1.0
  epsilon: 0.05
  batch_length: None

q_learning_kwargs:
  alpha: 0.05

state_inference_model:
  batch_size: 64  # matched to PPO
  n_epochs: 20
  grad_clip: 0.5
  n_steps: 2048 # matched to PPO
  persistant_optim: True
  optim_kwargs:
    lr: 0.0003 # matched to PPO