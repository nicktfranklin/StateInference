vae_kwargs:
  # FSQ levels for each dimension - this creates a codebook of size 8*5*5*5 = 1000
  fsq_levels: [8, 5, 5, 5]
  # Commitment loss weight (encourages encoder to commit to quantized values)
  beta: 0.25
  # Commitment cost coefficient
  commitment_cost: 0.25
encoder_class: CnnEncoder
decoder_class: CnnDecoder
encoder_kwargs:
  in_channels: 1
  channels:
    - 32
    - 64
    - 64
  kernel_sizes:
    - 8
    - 4
    - 3
  strides:
    - 4
    - 2
    - 1
decoder_kwargs:
  output_channels: 1